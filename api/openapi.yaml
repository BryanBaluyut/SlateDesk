openapi: 3.1.0
info:
  title: SlateDesk API
  description: |
    SlateDesk v2 HTTP API. Milestone 1 surface: local authentication
    (signed HttpOnly session cookie), users, and teams. Milestone 2 adds
    the ticket core: tickets, articles, attachments, tags, dashboard
    counters, and the realtime event stream. Milestone 3 adds the email
    channel's admin surface: mailbox configuration with live fetch/send
    tests and the Google OAuth connect flow, the instance external-URL
    setting, and outbound delivery status on articles with a retry
    operation.

    All errors are RFC 9457 problem details (`application/problem+json`).

    Access model (M2): every ticket-core operation requires an
    authenticated **agent or admin** session — customer access arrives
    with the M4 portal. The one stricter rule: `DELETE /tags/{id}` is
    **admin only**. Agents can additionally **read** users and teams
    (`GET /users`, `/users/{id}`, `/teams`, `/teams/{id}`) — the
    workspace needs them for assignee pickers, team routing, and
    requester lookups; all user/team mutations remain admin only. Each
    operation's description states its required role.

    Access model (M3): everything under `/mailboxes` and `/settings` is
    **admin only** (including the Google OAuth callback, which arrives as
    a top-level browser navigation carrying the admin's session cookie).
    `POST /articles/{id}/retry-send` is agent or admin, like the rest of
    the ticket core. Mailbox responses **never** contain credentials:
    passwords, client secrets, and OAuth tokens are write-only inputs.

    Milestone 4 makes SlateDesk a deployable product and adds six
    surfaces: the first-run **setup** wizard (`/setup/*`), the customer
    **portal** (`/portal/*`), the built-in **public** web form
    (`/public/tickets`), scoped **API keys** (`/api-keys`), outbound
    **webhooks** (`/webhooks`), and **canned replies**
    (`/canned-replies`).

    Authentication (M4): a second scheme, `apiKey`, is accepted on
    `/api/v1` as an **alternative** to the session cookie. The two appear
    as separate entries under the top-level `security`, and a list of
    requirement objects is an OR — so either scheme **alone**
    authenticates a request and the two are **never both required**. An
    API key is an `sd_live_`-prefixed bearer token
    (`Authorization: Bearer sd_live_…`) that acts as the admin or agent
    who minted it, carrying that key's scopes. Scopes are `read` and
    `write`: a `read`-only key may call safe (GET) operations but is
    refused with 403 on any mutating operation. OpenAPI cannot attach
    scopes to an HTTP-bearer scheme, so the write gate is enforced in the
    handler and documented here rather than expressed per-operation.
    Session cookies are not scope-limited.

    Access model (M4): the setup wizard (`/setup/*`) and the public web
    form (`/public/tickets`) are **unauthenticated** (see the setup-token
    note below and the per-operation rate-limit/anti-spam notes). The
    customer **portal** requires a **customer-role** principal and only
    ever exposes the caller's *own* tickets and their *public*
    (non-internal) articles — a hard isolation boundary; a request for
    another user's ticket returns **404, not 403**, so ticket existence
    is never disclosed (an agent/admin principal, including an API key,
    is refused with 403). **API keys** and **webhooks** are **admin
    only**; **canned replies** are **agent or admin**.

    Setup-token model: on first boot, before any admin exists, the server
    prints a one-time **installer URL** carrying a signed token to its
    logs (never a default password). `POST /setup/admin` requires that
    token and creates the first admin plus a session; the remaining setup
    steps authenticate with that admin session. The token is valid only
    while setup is incomplete and is invalidated the moment an admin
    exists — whether created through the wizard, `slatedesk admin
    create`, or the `SLATEDESK_ADMIN_EMAIL` / `SLATEDESK_ADMIN_PASSWORD`
    headless path. Setup state lives in the `settings` table, not process
    memory, so it survives restarts and is shared across replicas; every
    setup operation is idempotent.
  version: 0.4.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: /api/v1
    description: Same-origin API mount.

security:
  - cookieAuth: []
  - apiKey: []

tags:
  - name: auth
    description: Session lifecycle for browser clients.
  - name: users
    description: |
      User management. Reads are agent or admin (the workspace's assignee
      picker and requester lookups); mutations are admin only.
  - name: teams
    description: |
      Teams (routing queues) and their membership. Reads are agent or
      admin; mutations are admin only.
  - name: tickets
    description: Ticket core — lifecycle, fixed views, search, tag assignment.
  - name: articles
    description: Ticket thread messages (public replies and internal notes).
  - name: attachments
    description: Article-keyed file attachments (upload and download).
  - name: tags
    description: Tag management. Names are case-insensitively unique.
  - name: dashboard
    description: Workspace counters.
  - name: events
    description: Realtime Server-Sent Events stream.
  - name: mailboxes
    description: |
      Email channel configuration and health (M3). **Admin only.**
      Responses carry connection config and health but **never**
      credentials — passwords, client secrets, and OAuth tokens are
      write-only.
  - name: settings
    description: Instance settings. **Admin only.**
  - name: setup
    description: |
      First-run installer wizard (M4). Unauthenticated and gated on
      `setup_completed=false`; `POST /setup/admin` additionally requires
      the signed installer token printed to the logs on first boot.
  - name: portal
    description: |
      Customer self-service portal (M4). **Customer role only.** Every
      operation is scoped to the caller's own tickets and their public
      articles; cross-owner access returns 404, not 403.
  - name: public
    description: |
      Unauthenticated public web form (M4). One built-in endpoint;
      per-IP rate limited with a honeypot and an optional captcha stub.
  - name: api-keys
    description: |
      Scoped machine API keys (M4). **Admin only.** The plaintext key is
      shown once at creation and never again; only its SHA-256 digest is
      stored.
  - name: webhooks
    description: |
      Outbound HTTP webhooks with HMAC-SHA256 signatures and a durable
      delivery log (M4). **Admin only.**
  - name: canned-replies
    description: |
      Reusable agent reply snippets with basic variable substitution
      (M4). **Agent or admin.**

paths:
  /auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      description: |
        Verifies the credentials and, on success, sets the `sd_session`
        HttpOnly cookie (SameSite=Lax) carrying the signed session token.
        The response body is empty; the cookie is the session.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Authenticated. Session cookie set.
          headers:
            Set-Cookie:
              description: "`sd_session` signed HttpOnly session cookie."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials or deactivated account.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many login attempts; retry later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: |
        Clears the session cookie. Always succeeds for authenticated and
        unauthenticated callers alike; idempotent.
      tags: [auth]
      security: []
      responses:
        "204":
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              description: Expired `sd_session` cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      tags: [auth]
      responses:
        "200":
          description: The user the session cookie belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Problem"

  /users:
    get:
      operationId: listUsers
      summary: List users
      tags: [users]
      parameters:
        - name: role
          in: query
          description: Filter by role.
          schema:
            $ref: "#/components/schemas/Role"
        - name: active
          in: query
          description: Filter by active flag.
          schema:
            type: boolean
        - name: q
          in: query
          description: Case-insensitive substring match against email and name.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Page offset.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Matching users, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      summary: Create a user
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A user with this email already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUser
      summary: Get a user
      tags: [users]
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateUser
      summary: Update a user
      description: |
        Partial update; omitted fields are left unchanged. Setting `password`
        rehashes the password and bumps `token_version`, invalidating every
        outstanding session for the user. Email is immutable in M1.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deactivateUser
      summary: Deactivate a user
      description: |
        Soft delete: sets `active=false` and bumps `token_version` so all
        outstanding sessions die. The row is retained; there is no hard
        delete in M1.
      tags: [users]
      responses:
        "204":
          description: User deactivated.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /teams:
    get:
      operationId: listTeams
      summary: List teams
      tags: [teams]
      responses:
        "200":
          description: All teams, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTeam
      summary: Create a team
      tags: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A team with this name already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /teams/{id}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getTeam
      summary: Get a team with its members
      tags: [teams]
      responses:
        "200":
          description: The team, including member users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithMembers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateTeam
      summary: Update a team
      description: Partial update; omitted fields are left unchanged.
      tags: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: The updated team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A team with this name already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTeam
      summary: Delete a team
      description: Hard delete. Membership rows cascade; users are untouched.
      tags: [teams]
      responses:
        "204":
          description: Team deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /teams/{id}/members:
    put:
      operationId: setTeamMembers
      summary: Replace team membership
      description: |
        Replaces the full membership list with `user_ids` (idempotent PUT).
        Unknown user ids fail the whole request with 400; nothing is applied
        partially.
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/TeamID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTeamMembersRequest"
      responses:
        "200":
          description: The team with its new membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithMembers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /tickets:
    get:
      operationId: listTickets
      summary: List tickets
      description: |
        Filtered, paginated ticket list, most recent activity first
        (`updated_at` descending), or by relevance when `q` is present.
        Requires agent or admin role.

        `view` applies one of the fixed workspace views; every other
        filter composes with it (logical AND):

          - `my` — assigned to the caller, not closed
          - `unassigned` — no assignee, not closed
          - `open` — status is open, waiting_on_customer, or on_hold
          - `closed` — status is closed
      tags: [tickets]
      parameters:
        - name: view
          in: query
          description: Fixed workspace view applied before the other filters.
          schema:
            $ref: "#/components/schemas/TicketView"
        - name: status
          in: query
          description: Statuses to include (repeat the parameter). Empty = all.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TicketStatus"
        - name: priority
          in: query
          description: Priorities to include (repeat the parameter). Empty = all.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TicketPriority"
        - name: assignee_id
          in: query
          description: Only tickets assigned to this user.
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Only tickets owned by this team.
          schema:
            type: string
            format: uuid
        - name: tag_id
          in: query
          description: Only tickets bearing this tag.
          schema:
            type: string
            format: uuid
        - name: closed_today
          in: query
          description: |
            When true, only tickets closed since midnight (database
            timezone) — the same predicate as the dashboard's
            `closed_today` counter, so that tile can deep-link a queue
            whose contents match its number.
          schema:
            type: boolean
        - name: q
          in: query
          description: |
            Full-text search (websearch syntax, e.g. `printer -toner` or
            `"exact phrase"`) across ticket subjects and article bodies.
            When present, results are ranked by relevance.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Page offset.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of matching tickets plus the total match count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTicket
      summary: Create a ticket
      description: |
        Creates a ticket and its first article in one transaction: the
        day's ticket number (YYYYMMDD-NNNN) is allocated atomically, the
        body is recorded as an agent-authored public article
        (`sender_type=agent`, `channel=web`), and a `created` audit event
        plus a `ticket.created` stream event are emitted. The ticket
        starts `open`; priority defaults to `medium`. Requires agent or
        admin role.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Ticket created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"

  /tickets/{id}:
    parameters:
      - $ref: "#/components/parameters/TicketID"
    get:
      operationId: getTicket
      summary: Get a ticket with its full thread
      description: |
        The ticket plus requester/assignee summaries, tags, every article
        in chronological order (each carrying its attachments), and the
        audit event trail. Requires agent or admin role.
      tags: [tickets]
      responses:
        "200":
          description: The ticket detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateTicket
      summary: Update ticket fields
      description: |
        Partial update of status, priority, assignee, and team. Omitted
        fields are left unchanged; an explicit `null` for `assignee_id`
        or `team_id` clears that field. Setting `status=open` on a closed
        ticket is the reopen path. Every change is audited and emits a
        `ticket.updated` stream event. Requires agent or admin role.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketRequest"
      responses:
        "200":
          description: The updated ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /tickets/{id}/tags:
    put:
      operationId: setTicketTags
      summary: Replace a ticket's tags
      description: |
        Replaces the full tag set with `tag_ids` (idempotent PUT). Unknown
        tag ids fail the whole request with 400; nothing is applied
        partially. Emits a `tags_changed` audit event and a
        `ticket.updated` stream event. Requires agent or admin role.
      tags: [tickets]
      parameters:
        - $ref: "#/components/parameters/TicketID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTicketTagsRequest"
      responses:
        "200":
          description: The ticket's new tag set, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /tickets/{id}/articles:
    post:
      operationId: createTicketArticle
      summary: Add an article to a ticket
      description: |
        Appends an agent-authored article (`sender_type=agent`,
        `channel=web`) — a public reply or, with `is_internal=true`, an
        internal note. `body_html`, when provided, is sanitized
        server-side (bluemonday) before storage. A public reply on an
        open ticket flips it to `waiting_on_customer`; internal notes
        never change status. Emits an `article_added` audit event and an
        `article.created` stream event. Requires agent or admin role.
      tags: [articles]
      parameters:
        - $ref: "#/components/parameters/TicketID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArticleRequest"
      responses:
        "201":
          description: Article created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /articles/{id}/attachments:
    post:
      operationId: uploadArticleAttachment
      summary: Upload an attachment to an article
      description: |
        Multipart upload of one file (part name `file`), streamed to blob
        storage — the whole request body is capped at 25 MiB. The stored
        filename is the part's filename, sanitized; the content type is
        taken from the part header (falling back to
        `application/octet-stream`). Requires agent or admin role.
      tags: [attachments]
      parameters:
        - $ref: "#/components/parameters/ArticleID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to attach (max 25 MiB).
      responses:
        "201":
          description: Attachment stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        default:
          $ref: "#/components/responses/Problem"

  /articles/{id}/retry-send:
    post:
      operationId: retryArticleSend
      summary: Retry a failed outbound email delivery
      description: |
        Re-enqueues the email delivery of an outbound article whose
        `delivery_status` is `failed` (the terminal badge after the send
        job exhausted its retries). The article flips back to `queued`
        (emitting an `article.updated` stream event) and the send is
        retried with the **same** Message-ID that was committed before
        the first attempt, so a duplicate delivery can never fork the
        email thread. Only `failed` articles can be retried — anything
        else answers 409, with one recovery exception: an article stuck
        on `sending` whose send job no longer exists (the worker crashed
        on its final attempt) is also accepted; a send genuinely in
        flight still answers 409. Requires agent or admin role.
      tags: [articles]
      parameters:
        - $ref: "#/components/parameters/ArticleID"
      responses:
        "202":
          description: Delivery re-enqueued; the article is `queued` again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The article's delivery status is not `failed`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /attachments/{id}:
    get:
      operationId: downloadAttachment
      summary: Download an attachment
      description: |
        Streams the attachment bytes. The response `Content-Type` is the
        attachment's stored content type (`application/octet-stream`
        below is the declared fallback), and `Content-Disposition` is
        always `attachment` with a sanitized filename — attachments are
        downloads, never inline renders. Requires agent or admin role.
      tags: [attachments]
      parameters:
        - $ref: "#/components/parameters/AttachmentID"
      responses:
        "200":
          description: The attachment body.
          headers:
            Content-Disposition:
              description: '`attachment; filename="<sanitized>"`.'
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /tags:
    get:
      operationId: listTags
      summary: List tags
      description: All tags, sorted by name. Requires agent or admin role.
      tags: [tags]
      responses:
        "200":
          description: All tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTag
      summary: Create a tag
      description: |
        Tag names are case-insensitively unique. Requires agent or admin
        role.
      tags: [tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: Tag created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A tag with this name already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /tags/{id}:
    parameters:
      - $ref: "#/components/parameters/TagID"
    patch:
      operationId: updateTag
      summary: Update a tag
      description: |
        Partial update; omitted fields are left unchanged; explicit
        `color: null` clears the color. Requires agent or admin role.
      tags: [tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagRequest"
      responses:
        "200":
          description: The updated tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A tag with this name already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTag
      summary: Delete a tag
      description: |
        Hard delete; the tag disappears from every ticket (ticket_tags
        rows cascade). **Admin only.**
      tags: [tags]
      responses:
        "204":
          description: Tag deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /dashboard/counters:
    get:
      operationId: getDashboardCounters
      summary: Get the dashboard counters
      description: |
        The four workspace counters in one call. `closed_today` counts
        tickets closed since midnight in the database's timezone (UTC in
        deployment). Requires agent or admin role.
      tags: [dashboard]
      responses:
        "200":
          description: Current counter values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCounters"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"

  /events:
    get:
      operationId: streamEvents
      summary: Realtime event stream (SSE)
      description: |
        Server-Sent Events stream of ticket activity, intended for
        workspace cache invalidation. Each event is one `data:` frame
        whose payload is a JSON `StreamEvent` (`{type, ticket_id}`); no
        SSE `event:` or `id:` fields are used. Event types:
        `ticket.created`, `ticket.updated`, `article.created`,
        `article.updated` (an existing article changed — in M3 that is
        an email `delivery_status` transition), plus `resync` (no
        `ticket_id`) when the server may have dropped events (e.g. it
        re-established its own database LISTEN connection) — on
        `resync` a client must refetch everything it displays.

        Events are invalidation hints, not a durable feed: a client that
        connects (or reconnects) must refetch whatever it displays. A
        comment heartbeat (`: ping`) is written every ~25 seconds to keep
        intermediaries from closing idle connections. Requires agent or
        admin role.
      tags: [events]
      responses:
        "200":
          description: |
            The event stream (`text/event-stream`). The declared schema
            describes the JSON payload of each `data:` frame, not the raw
            stream body.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: |
            Too many concurrent event streams on this server; retry
            later (the UI degrades gracefully — events only accelerate
            refetches).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes:
    get:
      operationId: listMailboxes
      summary: List mailboxes
      description: |
        All configured mailboxes with their connection config and health
        columns (`last_poll_at`, `last_error`, `last_error_at`) feeding
        the admin screen's health pills. Credentials are never included.
        **Admin only.**
      tags: [mailboxes]
      responses:
        "200":
          description: All mailboxes, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mailbox"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMailbox
      summary: Create a mailbox
      description: |
        Creates a mailbox. The request is discriminated on `auth_kind`;
        each kind carries its own write-only credential fields:

          - `basic` — `password` (IMAP/SMTP login password)
          - `oauth_m365` — `tenant_id`, `client_id`, `client_secret`
            (Entra app registration; client-credentials XOAUTH2)
          - `oauth_google` — `client_id`, `client_secret` (Google Cloud
            OAuth client; the offline refresh token is obtained
            afterwards via `POST /mailboxes/{id}/oauth/google/start`)

        Secrets are encrypted at rest and **never** returned by any
        response. New mailboxes default to `active=true`; the poller
        adopts an active mailbox within one lease interval. **Admin
        only.**
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMailboxRequest"
      responses:
        "201":
          description: Mailbox created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A mailbox with this email address already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/MailboxID"
    get:
      operationId: getMailbox
      summary: Get a mailbox
      description: |
        Connection config and health; never credentials. **Admin only.**
      tags: [mailboxes]
      responses:
        "200":
          description: The mailbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMailbox
      summary: Update a mailbox
      description: |
        Partial update; omitted fields are left unchanged. The write-only
        credential fields rotate the stored secrets: `password` (basic),
        `tenant_id`/`client_id`/`client_secret` (OAuth kinds). Rotating a
        credential drops any cached OAuth access token; rotating an
        `oauth_google` client additionally invalidates the stored refresh
        token, so the Google connect flow must be run again. Changing
        `auth_kind` requires supplying the credential fields the new kind
        needs (400 otherwise). The response never echoes secrets. **Admin
        only.**
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMailboxRequest"
      responses:
        "200":
          description: The updated mailbox (credentials never included).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A mailbox with this email address already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMailbox
      summary: Delete a mailbox
      description: |
        Hard delete: the poller drops the mailbox and its lease. Email
        threading state survives (recorded Message-IDs keep their
        tickets; only their mailbox link is cleared), so replies to mail
        sent through the deleted mailbox still thread correctly if
        another mailbox receives them. **Admin only.**
      tags: [mailboxes]
      responses:
        "204":
          description: Mailbox deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{id}/test-fetch:
    post:
      operationId: testMailboxFetch
      summary: Test the mailbox's IMAP connection
      description: |
        Performs a live IMAP dial + authentication + SELECT INBOX with
        the stored credentials and reports the outcome. A failed test is
        a **200 with `ok=false`** — the test ran; its result is the
        payload. Non-2xx responses mean the test could not be attempted
        at all. May take several seconds (network timeouts). **Admin
        only.**
      tags: [mailboxes]
      parameters:
        - $ref: "#/components/parameters/MailboxID"
      responses:
        "200":
          description: Test outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{id}/test-send:
    post:
      operationId: testMailboxSend
      summary: Send a test email through the mailbox
      description: |
        Performs a live SMTP dial + authentication and sends a short
        test message to `to` from the mailbox's address. A failed send
        is a **200 with `ok=false`**; non-2xx means the test could not
        be attempted. The test mail carries auto-generated headers
        (`Auto-Submitted`, `X-Auto-Response-Suppress`) so it can never
        start an autoresponder loop, and it is not recorded on any
        ticket. **Admin only.**
      tags: [mailboxes]
      parameters:
        - $ref: "#/components/parameters/MailboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxTestSendRequest"
      responses:
        "200":
          description: Test outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{id}/oauth/google/start:
    post:
      operationId: startMailboxGoogleOauth
      summary: Start the Google OAuth connect flow
      description: |
        Builds the Google authorization URL for an `oauth_google`
        mailbox (authorization-code flow with offline access, so the
        exchange yields a refresh token) and returns it for the browser
        to navigate to. The `redirect_uri` is derived from the instance
        external URL setting
        (`{external_url}/api/v1/mailboxes/oauth/google/callback`) and
        must be registered on the Google OAuth client. The signed,
        single-use `state` parameter binds the callback to this mailbox
        and session. 409 when the mailbox is not `oauth_google` or the
        external URL setting is unset. **Admin only.**
      tags: [mailboxes]
      parameters:
        - $ref: "#/components/parameters/MailboxID"
      responses:
        "200":
          description: The authorization URL to send the admin's browser to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOauthStart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The mailbox's `auth_kind` is not `oauth_google`, or the
            instance external URL setting is not configured (PUT
            /settings/external-url first).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/oauth/google/callback:
    get:
      operationId: mailboxGoogleOauthCallback
      summary: Google OAuth redirect target
      description: |
        Browser redirect target of the Google connect flow — not called
        by API clients. Validates `state` (signed, single-use, bound to
        the mailbox and the initiating admin session), exchanges `code`
        for tokens, persists the refresh token into the mailbox's
        encrypted credentials, and redirects to
        `/settings/mailboxes?connected=1`. Because this is a top-level
        navigation, the admin's SameSite=Lax session cookie is sent —
        the endpoint is as **admin only** as the rest of the mailbox
        surface. A missing/invalid `state`, a provider `error`, or a
        failed code exchange is a 400 problem; nothing is persisted.
      tags: [mailboxes]
      parameters:
        - name: state
          in: query
          required: true
          description: Signed single-use state minted by the start operation.
          schema:
            type: string
        - name: code
          in: query
          description: Authorization code (present on provider success).
          schema:
            type: string
        - name: error
          in: query
          description: Provider error code (e.g. `access_denied`), if any.
          schema:
            type: string
      responses:
        "303":
          description: |
            Refresh token stored; browser sent to
            `/settings/mailboxes?connected=1`.
          headers:
            Location:
              description: "`/settings/mailboxes?connected=1`"
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /settings/external-url:
    get:
      operationId: getExternalUrl
      summary: Get the instance external URL
      description: |
        The public base URL this instance is reached at (used to build
        the Google OAuth `redirect_uri`; later, links in outbound
        email). `external_url` is `""` until configured. **Admin only.**
      tags: [settings]
      responses:
        "200":
          description: The current setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalUrlSetting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setExternalUrl
      summary: Set the instance external URL
      description: |
        Sets the public base URL: an absolute `http`/`https` URL with no
        path, query, or fragment (e.g. `https://desk.example.com`); a
        trailing slash is stripped. Idempotent PUT. **Admin only.**
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetExternalUrlRequest"
      responses:
        "200":
          description: The stored (normalized) setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalUrlSetting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"

  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Get first-run setup status
      description: |
        Whether the first-run installer has completed and whether the
        signed installer token is still required. Unauthenticated so the
        wizard SPA can decide what to render before any account exists.
        `needs_token` is true only while no admin exists yet — the state
        in which `POST /setup/admin` must carry the installer token; once
        an admin exists, the remaining steps use that admin's session.
      tags: [setup]
      security: []
      responses:
        "200":
          description: Current setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Problem"

  /setup/admin:
    post:
      operationId: createSetupAdmin
      summary: Create the first admin (installer step 1)
      description: |
        Creates the first administrator account and immediately opens a
        session for it (sets the `sd_session` cookie). Requires the signed
        installer token printed to the server logs on first boot — never a
        default credential. Valid only while no admin exists yet; once an
        admin exists the token is invalidated and this returns 409. The
        subsequent installer steps authenticate with the session set here.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupAdminRequest"
      responses:
        "200":
          description: Admin created and signed in; session cookie set.
          headers:
            Set-Cookie:
              description: "`sd_session` signed HttpOnly session cookie."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Missing, invalid, or expired installer token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Setup is already complete (an admin already exists).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /setup/instance:
    post:
      operationId: setSetupInstance
      summary: Set instance name and external URL (installer step 2)
      description: |
        Records the instance display name and public external URL. Uses
        the admin principal established by `POST /setup/admin` (or any
        admin principal); available only while setup is incomplete.
        Idempotent — re-submitting overwrites. The external URL is
        normalized like `PUT /settings/external-url` (absolute http(s), no
        path/query/fragment, trailing slash stripped). **Admin only.**
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInstanceRequest"
      responses:
        "200":
          description: The stored (normalized) instance settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Setup is already complete.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /setup/complete:
    post:
      operationId: completeSetup
      summary: Finish first-run setup (installer step 3)
      description: |
        Marks setup complete — which permanently invalidates the installer
        token — and seeds a welcome ticket so the workspace opens on a
        working example rather than an empty queue. Available only while
        setup is incomplete; a second call after completion returns 409.
        **Admin only.**
      tags: [setup]
      responses:
        "200":
          description: Setup completed; welcome ticket seeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupCompleteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Setup is already complete.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /portal/tickets:
    get:
      operationId: listPortalTickets
      summary: List my tickets
      description: |
        Every ticket whose requester is the calling customer, newest
        first. **Customer role only.** No other user's tickets are ever
        returned; assignee and team are omitted from the portal
        projection.
      tags: [portal]
      responses:
        "200":
          description: The caller's own tickets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalTicket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPortalTicket
      summary: Open a new ticket
      description: |
        Opens a ticket with the calling customer as requester (channel
        `web`); the body becomes the first public article. **Customer role
        only.**
      tags: [portal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalCreateTicketRequest"
      responses:
        "201":
          description: Ticket created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalTicketDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"

  /portal/tickets/{id}:
    parameters:
      - $ref: "#/components/parameters/PortalTicketID"
    get:
      operationId: getPortalTicket
      summary: Get one of my tickets
      description: |
        The ticket and its thread, filtered to **public** articles only —
        internal notes are never included. **Customer role only.** A
        ticket the caller does not own returns **404, not 403**, so the
        endpoint cannot be used to probe which ticket ids exist.
      tags: [portal]
      responses:
        "200":
          description: The ticket with its public thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalTicketDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /portal/tickets/{id}/reply:
    parameters:
      - $ref: "#/components/parameters/PortalTicketID"
    post:
      operationId: replyPortalTicket
      summary: Reply to one of my tickets
      description: |
        Appends a public customer reply to the ticket and, if it was
        `waiting_on_customer`, flips it back to `open`. **Customer role
        only.** A ticket the caller does not own returns **404, not
        403**.
      tags: [portal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalReplyRequest"
      responses:
        "201":
          description: Reply appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalArticle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /public/tickets:
    post:
      operationId: submitPublicTicket
      summary: Submit a ticket from the public web form
      description: |
        Unauthenticated ticket intake for the single built-in web form
        (channel `web`). The requester is auto-created from (or matched
        to) `email`; the body becomes the first public article. Returns
        **202** with the assigned ticket number.

        Abuse controls: the request is **rate limited per client IP** (429
        when exceeded). `_honeypot` is a hidden field that real users
        leave empty — when it is non-empty the submission is silently
        accepted (still **202**) but no ticket is created, so bots get no
        signal, and `ticket_number` is then absent. An optional captcha
        verification stub is **off by default**; when an operator enables
        it, a missing or invalid token is a 400.
      tags: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicTicketRequest"
      responses:
        "202":
          description: |
            Submission accepted. `ticket_number` is present when a ticket
            was created and absent when the submission was silently
            dropped by an anti-spam control.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTicketAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Too many submissions from this client; retry later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys
      description: |
        All API keys, live first then revoked, newest first. Secrets are
        never included — only the display prefix, scopes, and usage
        metadata. **Admin only.**
      tags: [api-keys]
      responses:
        "200":
          description: All API keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createApiKey
      summary: Create an API key
      description: |
        Mints a scoped key. The full plaintext key (`sd_live_…`) is
        returned **once** in this response and never again — store it now.
        Only its SHA-256 digest is persisted. **Admin only.**
      tags: [api-keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Key created; plaintext returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"

  /api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ApiKeyID"
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: |
        Revokes the key (soft delete): it stops authenticating
        immediately, but the row is retained for the audit trail.
        Idempotent — revoking an unknown or already-revoked key is a 404.
        **Admin only.**
      tags: [api-keys]
      responses:
        "204":
          description: Key revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /webhooks:
    get:
      operationId: listWebhooks
      summary: List webhooks
      description: |
        All configured webhook endpoints, newest first. The signing secret
        is never included. **Admin only.**
      tags: [webhooks]
      responses:
        "200":
          description: All webhooks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWebhook
      summary: Create a webhook
      description: |
        Registers an outbound endpoint subscribed to one or more event
        types (`ticket.created`, `ticket.updated`, `article.created`).
        Each delivery is signed `X-SlateDesk-Signature: sha256=<hex HMAC>`
        over the raw body using the endpoint's signing secret. Supply
        `secret` to set that secret, or omit it to have one generated;
        either way the effective secret is returned **once** as
        `signing_secret` so it can be configured on the receiver, and it is
        never returned again. **Admin only.**
      tags: [webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: Webhook created; signing secret returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"

  /webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    patch:
      operationId: updateWebhook
      summary: Update a webhook
      description: |
        Partial update; omitted fields are left unchanged. Supplying
        `secret` rotates the signing secret; like other credential
        rotations, the new secret is **not** echoed in the response.
        **Admin only.**
      tags: [webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
      responses:
        "200":
          description: The updated webhook (secret never included).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook
      description: |
        Removes the endpoint and its delivery log (cascade). **Admin
        only.**
      tags: [webhooks]
      responses:
        "204":
          description: Webhook deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /webhooks/{id}/test:
    post:
      operationId: testWebhook
      summary: Send a test ping to a webhook
      description: |
        Synchronously delivers a signed `ping` payload to the endpoint and
        reports the outcome. A non-2xx response from the endpoint is a
        **200 with `ok=false`** — the ping was attempted; the result is the
        payload. The ping is not recorded in the delivery log. **Admin
        only.**
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "200":
          description: Test outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List recent webhook deliveries
      description: |
        The endpoint's recent delivery attempts, newest first — the
        durable outbox log (status, HTTP response code, attempt count, last
        error). **Admin only.**
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/WebhookID"
        - name: limit
          in: query
          description: Maximum rows to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Recent deliveries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /canned-replies:
    get:
      operationId: listCannedReplies
      summary: List canned replies
      description: |
        All canned replies, sorted by title. **Agent or admin.**
      tags: [canned-replies]
      responses:
        "200":
          description: All canned replies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CannedReply"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCannedReply
      summary: Create a canned reply
      description: |
        Stores a reusable snippet. The `body` keeps its raw template;
        `{{ticket.number}}` and `{{requester.name}}` placeholders are
        substituted at composer-insert time, not stored expanded. **Agent
        or admin.**
      tags: [canned-replies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCannedReplyRequest"
      responses:
        "201":
          description: Canned reply created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CannedReply"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"

  /canned-replies/{id}:
    parameters:
      - $ref: "#/components/parameters/CannedReplyID"
    patch:
      operationId: updateCannedReply
      summary: Update a canned reply
      description: |
        Partial update; omitted fields are left unchanged. **Agent or
        admin.**
      tags: [canned-replies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCannedReplyRequest"
      responses:
        "200":
          description: The updated canned reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CannedReply"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCannedReply
      summary: Delete a canned reply
      description: |
        Permanently removes the snippet. **Agent or admin.**
      tags: [canned-replies]
      responses:
        "204":
          description: Canned reply deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sd_session
      description: |
        Signed HttpOnly session cookie (SameSite=Lax) carrying the user id
        and token_version. Obtained via POST /auth/login; cleared via
        POST /auth/logout.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sd_live_...
      description: |
        Scoped machine API key presented as
        `Authorization: Bearer sd_live_…`. An **alternative** to
        `cookieAuth` on every `/api/v1` operation: because the top-level
        `security` lists the two schemes as separate requirement objects
        (an OR), either scheme alone authenticates a request and the two
        are never both required. The key is a public `sd_live_` prefix
        plus 256 bits of base62 entropy; only its SHA-256 digest is
        stored, and the request acts as the admin or agent who created
        the key, carrying that key's scopes. Scopes are `read` and
        `write` — a `read` key is refused (403) on mutating operations.
        OpenAPI cannot bind scopes to an HTTP-bearer scheme, so the scope
        gate is enforced in the handler and documented rather than
        expressed as security scopes here.

  parameters:
    UserID:
      name: id
      in: path
      required: true
      description: User id.
      schema:
        type: string
        format: uuid
    TeamID:
      name: id
      in: path
      required: true
      description: Team id.
      schema:
        type: string
        format: uuid
    TicketID:
      name: id
      in: path
      required: true
      description: Ticket id.
      schema:
        type: string
        format: uuid
    ArticleID:
      name: id
      in: path
      required: true
      description: Article id.
      schema:
        type: string
        format: uuid
    AttachmentID:
      name: id
      in: path
      required: true
      description: Attachment id.
      schema:
        type: string
        format: uuid
    TagID:
      name: id
      in: path
      required: true
      description: Tag id.
      schema:
        type: string
        format: uuid
    MailboxID:
      name: id
      in: path
      required: true
      description: Mailbox id.
      schema:
        type: string
        format: uuid
    ApiKeyID:
      name: id
      in: path
      required: true
      description: API key id.
      schema:
        type: string
        format: uuid
    WebhookID:
      name: id
      in: path
      required: true
      description: Webhook id.
      schema:
        type: string
        format: uuid
    CannedReplyID:
      name: id
      in: path
      required: true
      description: Canned reply id.
      schema:
        type: string
        format: uuid
    PortalTicketID:
      name: id
      in: path
      required: true
      description: Ticket id (must belong to the calling customer).
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Malformed request body or parameters.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, invalid, or expired session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but not allowed to perform this action.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ContentTooLarge:
      description: "Request body exceeds the size limit (attachments: 25 MiB)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem:
      description: Any other error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Role:
      type: string
      description: User role.
      enum: [customer, agent, admin]

    User:
      type: object
      description: |
        A SlateDesk user. Sensitive columns (password_hash, oidc_subject,
        token_version) are never serialized.
      required: [id, email, name, role, company, active, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        company:
          type: string
          description: Free-form company label ('' when unset).
        active:
          type: boolean
          description: Deactivated users cannot log in; false means soft-deleted.
        created_at:
          type: string
          format: date-time

    Team:
      type: object
      description: A team (routing queue).
      required: [id, name, description]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string

    TeamWithMembers:
      description: A team including its member users.
      allOf:
        - $ref: "#/components/schemas/Team"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/User"

    Problem:
      type: object
      description: RFC 9457 problem details. Media type application/problem+json.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI; "about:blank" when unspecified.
          default: "about:blank"
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Occurrence-specific explanation.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this occurrence (request path).

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    CreateUserRequest:
      type: object
      required: [email, name, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        password:
          type: string
          minLength: 10
          description: |
            Optional initial password (minimum 10 characters). Omit for users
            who will authenticate via OIDC (M5) or never log in.
        company:
          type: string
          description: Defaults to '' when omitted.

    UpdateUserRequest:
      type: object
      description: Partial update; omitted fields are left unchanged.
      properties:
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        company:
          type: string
        active:
          type: boolean
        password:
          type: string
          minLength: 10
          description: |
            New password (minimum 10 characters); bumps token_version
            (logout everywhere).

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          description: Defaults to '' when omitted.

    UpdateTeamRequest:
      type: object
      description: Partial update; omitted fields are left unchanged.
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    SetTeamMembersRequest:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          description: Complete replacement membership list. May be empty.
          items:
            type: string
            format: uuid

    TicketStatus:
      type: string
      description: Ticket lifecycle status.
      enum: [open, waiting_on_customer, on_hold, closed]

    TicketPriority:
      type: string
      description: Ticket priority.
      enum: [low, medium, high, critical]

    TicketView:
      type: string
      description: |
        Fixed workspace views: `my` (assigned to the caller, not closed),
        `unassigned` (no assignee, not closed), `open` (any non-closed
        status), `closed` (closed only).
      enum: [my, unassigned, open, closed]

    ArticleSenderType:
      type: string
      description: Who authored an article.
      enum: [customer, agent, system]

    ArticleChannel:
      type: string
      description: The channel an article arrived through.
      enum: [email, api, web]

    UserSummary:
      type: object
      description: Compact user reference embedded in tickets and articles.
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email

    Ticket:
      type: object
      description: A ticket, as returned by list and update operations.
      required:
        - id
        - number
        - subject
        - status
        - priority
        - requester
        - assignee
        - team_id
        - created_at
        - updated_at
        - closed_at
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Human-facing ticket number (YYYYMMDD-NNNN).
          pattern: "^[0-9]{8}-[0-9]{4,}$"
        subject:
          type: string
        status:
          $ref: "#/components/schemas/TicketStatus"
        priority:
          $ref: "#/components/schemas/TicketPriority"
        requester:
          $ref: "#/components/schemas/UserSummary"
        assignee:
          description: Assigned agent; null when unassigned.
          anyOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        team_id:
          type: ["string", "null"]
          format: uuid
          description: Owning team; null when not routed to a team.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: ["string", "null"]
          format: date-time
          description: Set while the ticket is closed; null otherwise.

    TicketList:
      type: object
      description: One page of tickets plus the pre-pagination match count.
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total matching tickets before limit/offset.

    TicketDetail:
      description: |
        A ticket with its full thread: tags, every article in
        chronological order (each carrying its attachments), and the
        audit event trail.
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required: [tags, articles, events]
          properties:
            tags:
              type: array
              description: The ticket's tags, sorted by name.
              items:
                $ref: "#/components/schemas/Tag"
            articles:
              type: array
              description: All articles, oldest first.
              items:
                $ref: "#/components/schemas/Article"
            events:
              type: array
              description: Audit trail, oldest first.
              items:
                $ref: "#/components/schemas/TicketEvent"

    Article:
      type: object
      description: |
        One message in a ticket's thread. `body_html`, when present, was
        sanitized (bluemonday) at write time and is safe to render;
        `body_text` always exists and feeds search. `delivery_status` is
        the outbound email badge (null on articles that are not outbound
        email).
      required:
        - id
        - ticket_id
        - author
        - sender_type
        - channel
        - is_internal
        - body_text
        - body_html
        - delivery_status
        - attachments
        - created_at
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        author:
          description: Authoring user; null for external or system authors.
          anyOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        sender_type:
          $ref: "#/components/schemas/ArticleSenderType"
        channel:
          $ref: "#/components/schemas/ArticleChannel"
        is_internal:
          type: boolean
          description: Internal notes are never shown to customers.
        body_text:
          type: string
        body_html:
          type: ["string", "null"]
          description: Sanitized HTML body; null when the article is plain text.
        delivery_status:
          description: |
            Outbound email delivery badge; null on articles that are not
            outbound email (inbound mail, internal notes, web/api
            articles on tickets without an email origin).
          anyOf:
            - $ref: "#/components/schemas/DeliveryStatus"
            - type: "null"
        attachments:
          type: array
          description: Files attached to this article.
          items:
            $ref: "#/components/schemas/Attachment"
        created_at:
          type: string
          format: date-time

    DeliveryStatus:
      type: string
      description: |
        Outbound email delivery state of an article. Transitions:

          - `queued` — the article and its send job committed in one
            transaction; the job has not started yet.
          - `queued → sending` — the send worker committed the outbound
            Message-ID (threading is safe from here on) and is dialing
            SMTP. On worker crash the job retries from here with the
            same Message-ID.
          - `sending → sent` — the SMTP server accepted the message.
            Terminal.
          - `sending → failed` — every retry (capped backoff) failed.
            Terminal, shown as a visible badge; `POST
            /articles/{id}/retry-send` moves it back to `queued`.
          - `sending → queued` — recovery only: a worker crash on the
            final attempt can strand the badge on `sending` (the job is
            discarded without running); retry-send accepts that stuck
            state once no live send job remains.

        Every transition emits an `article.updated` stream event.
      enum: [queued, sending, sent, failed]

    Attachment:
      type: object
      description: |
        Attachment metadata; the bytes live at GET /attachments/{id}.
      required: [id, article_id, filename, content_type, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        article_id:
          type: string
          format: uuid
        filename:
          type: string
          description: Sanitized original filename.
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time

    TicketEvent:
      type: object
      description: |
        Slim audit event. `payload` is a small type-specific JSON
        document (e.g. `{"from": "open", "to": "closed"}` for
        status_changed).
      required: [id, ticket_id, actor_id, type, payload, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: Insertion-ordered id (stable even within one transaction).
        ticket_id:
          type: string
          format: uuid
        actor_id:
          type: ["string", "null"]
          format: uuid
          description: Acting user; null for system actions.
        type:
          type: string
          description: |
            Event type. One of: created, article_added, status_changed,
            priority_changed, assignee_changed, team_changed, tags_changed.
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    Tag:
      type: object
      description: A tag. Names are case-insensitively unique.
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: ["string", "null"]
          description: Display color hint (e.g. "#RRGGBB"); null when unset.

    DashboardCounters:
      type: object
      description: The four workspace dashboard counters.
      required: [open, unassigned, waiting_on_customer, closed_today]
      properties:
        open:
          type: integer
          format: int64
          minimum: 0
          description: Tickets with status open.
        unassigned:
          type: integer
          format: int64
          minimum: 0
          description: Non-closed tickets with no assignee.
        waiting_on_customer:
          type: integer
          format: int64
          minimum: 0
          description: Tickets with status waiting_on_customer.
        closed_today:
          type: integer
          format: int64
          minimum: 0
          description: Tickets closed since midnight (database timezone).

    StreamEvent:
      type: object
      description: |
        JSON payload of one SSE `data:` frame on GET /events. A
        cache-invalidation hint, not a durable feed. `ticket_id` is
        present on the ticket-scoped types and absent on `resync`
        (which means: events may have been dropped, refetch everything).
      required: [type]
      properties:
        type:
          type: string
          enum:
            - ticket.created
            - ticket.updated
            - article.created
            - article.updated
            - resync
        ticket_id:
          type: string
          format: uuid

    CreateTicketRequest:
      type: object
      required: [subject, body]
      properties:
        subject:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
          description: |
            Plain-text body of the ticket's first article (recorded as an
            agent-authored public web article).
        priority:
          $ref: "#/components/schemas/TicketPriority"
        team_id:
          type: string
          format: uuid
          description: Route the ticket to this team.
        requester_id:
          type: string
          format: uuid
          description: |
            The user the ticket is for (e.g. opening a ticket on a
            customer's behalf). Defaults to the caller when omitted.

    UpdateTicketRequest:
      type: object
      description: |
        Partial update; omitted fields are left unchanged. `assignee_id`
        and `team_id` are tri-state: omitted = unchanged, a uuid = set,
        explicit null = cleared.
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"
        priority:
          $ref: "#/components/schemas/TicketPriority"
        assignee_id:
          type: ["string", "null"]
          format: uuid
        team_id:
          type: ["string", "null"]
          format: uuid

    SetTicketTagsRequest:
      type: object
      required: [tag_ids]
      properties:
        tag_ids:
          type: array
          description: Complete replacement tag set. May be empty.
          items:
            type: string
            format: uuid

    CreateArticleRequest:
      type: object
      required: [body_text, is_internal]
      properties:
        body_text:
          type: string
          minLength: 1
        body_html:
          type: string
          description: |
            Optional HTML rendering of the body; sanitized server-side
            (bluemonday UGC policy) before storage.
        is_internal:
          type: boolean
          description: |
            true = internal note (never customer-visible, never changes
            status); false = public reply.

    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string
          description: Display color hint (e.g. "#RRGGBB").

    UpdateTagRequest:
      type: object
      description: |
        Partial update; omitted fields are left unchanged; explicit
        `color: null` clears the color.
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: ["string", "null"]

    MailboxAuthKind:
      type: string
      description: |
        How the mailbox authenticates to its IMAP/SMTP servers: `basic`
        (username + password), `oauth_m365` (Entra client-credentials
        XOAUTH2), `oauth_google` (Google authorization-code XOAUTH2 with
        an offline refresh token).
      enum: [basic, oauth_m365, oauth_google]

    MailTLSMode:
      type: string
      description: |
        TLS posture of a mail connection: `tls` (implicit TLS),
        `starttls` (mandatory STARTTLS upgrade), `none` (cleartext —
        local dev/test servers only; never use in production).
      enum: [tls, starttls, none]

    Mailbox:
      type: object
      description: |
        A configured email mailbox: connection config plus the health
        columns behind the admin screen's health pills. Credentials
        (password, client secret, OAuth tokens) are **never** included
        in any response.
      required:
        - id
        - name
        - email_address
        - active
        - auth_kind
        - imap_host
        - imap_port
        - imap_tls_mode
        - imap_username
        - smtp_host
        - smtp_port
        - smtp_tls_mode
        - smtp_username
        - oauth_tenant_id
        - oauth_client_id
        - from_display_name
        - signature
        - auto_ack_enabled
        - last_poll_at
        - last_error
        - last_error_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name of the mailbox (e.g. "Support").
        email_address:
          type: string
          format: email
          description: The address this mailbox sends and receives as. Unique.
        active:
          type: boolean
          description: Inactive mailboxes are neither polled nor sent through.
        auth_kind:
          $ref: "#/components/schemas/MailboxAuthKind"
        imap_host:
          type: string
        imap_port:
          type: integer
          minimum: 1
          maximum: 65535
        imap_tls_mode:
          $ref: "#/components/schemas/MailTLSMode"
        imap_username:
          type: string
        smtp_host:
          type: string
        smtp_port:
          type: integer
          minimum: 1
          maximum: 65535
        smtp_tls_mode:
          $ref: "#/components/schemas/MailTLSMode"
        smtp_username:
          type: string
        oauth_tenant_id:
          type: ["string", "null"]
          description: Entra tenant id; null unless auth_kind is oauth_m365.
        oauth_client_id:
          type: ["string", "null"]
          description: OAuth client id; null for basic-auth mailboxes.
        from_display_name:
          type: string
          description: From header display name ('' = use the mailbox name).
        signature:
          type: string
          description: Appended to outbound mail ('' = none).
        auto_ack_enabled:
          type: boolean
          description: Send the loop-guarded auto-acknowledgement for new tickets.
        last_poll_at:
          type: ["string", "null"]
          format: date-time
          description: |
            Last successful poll; null before the first success. Stays at
            the last success while errors occur, so "last worked at" is
            visible next to the error.
        last_error:
          type: ["string", "null"]
          description: Most recent poll/send error; null when healthy.
        last_error_at:
          type: ["string", "null"]
          format: date-time
          description: When last_error occurred; null when healthy.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MailboxConfig:
      type: object
      description: |
        Writable connection/config fields shared by every mailbox create
        variant (credential fields live on the variants).
      required:
        - name
        - email_address
        - imap_host
        - imap_port
        - imap_username
        - smtp_host
        - smtp_port
        - smtp_username
      properties:
        name:
          type: string
          minLength: 1
        email_address:
          type: string
          format: email
        active:
          type: boolean
          default: true
        imap_host:
          type: string
          minLength: 1
        imap_port:
          type: integer
          minimum: 1
          maximum: 65535
        imap_tls_mode:
          $ref: "#/components/schemas/MailTLSMode"
          default: tls
        imap_username:
          type: string
          minLength: 1
        smtp_host:
          type: string
          minLength: 1
        smtp_port:
          type: integer
          minimum: 1
          maximum: 65535
        smtp_tls_mode:
          $ref: "#/components/schemas/MailTLSMode"
          default: starttls
        smtp_username:
          type: string
          minLength: 1
        from_display_name:
          type: string
          description: Defaults to '' (the mailbox name is used).
        signature:
          type: string
          description: Defaults to ''.
        auto_ack_enabled:
          type: boolean
          default: true

    CreateMailboxBasicRequest:
      description: Password-authenticated IMAP/SMTP mailbox.
      allOf:
        - $ref: "#/components/schemas/MailboxConfig"
        - type: object
          required: [auth_kind, password]
          properties:
            auth_kind:
              type: string
              enum: [basic]
            password:
              type: string
              minLength: 1
              writeOnly: true
              description: |
                IMAP/SMTP login password. Write-only: encrypted at rest,
                never returned by any response.

    CreateMailboxOauthM365Request:
      description: |
        Microsoft 365 mailbox (Entra app registration, client-credentials
        XOAUTH2). Per-mailbox access is restricted Entra-side via
        application access policies.
      allOf:
        - $ref: "#/components/schemas/MailboxConfig"
        - type: object
          required: [auth_kind, tenant_id, client_id, client_secret]
          properties:
            auth_kind:
              type: string
              enum: [oauth_m365]
            tenant_id:
              type: string
              minLength: 1
              writeOnly: true
              description: |
                Entra tenant id. Write-only here; echoed back (not
                secret) as `oauth_tenant_id`.
            client_id:
              type: string
              minLength: 1
              writeOnly: true
              description: |
                App registration client id. Write-only here; echoed back
                (not secret) as `oauth_client_id`.
            client_secret:
              type: string
              minLength: 1
              writeOnly: true
              description: |
                App registration client secret. Write-only: encrypted at
                rest, never returned by any response.

    CreateMailboxOauthGoogleRequest:
      description: |
        Google Workspace/Gmail mailbox (authorization-code XOAUTH2). The
        offline refresh token is NOT part of this request — after
        creating the mailbox, run `POST
        /mailboxes/{id}/oauth/google/start` and complete the browser
        consent flow; the callback stores the refresh token.
      allOf:
        - $ref: "#/components/schemas/MailboxConfig"
        - type: object
          required: [auth_kind, client_id, client_secret]
          properties:
            auth_kind:
              type: string
              enum: [oauth_google]
            client_id:
              type: string
              minLength: 1
              writeOnly: true
              description: |
                Google OAuth client id. Write-only here; echoed back (not
                secret) as `oauth_client_id`.
            client_secret:
              type: string
              minLength: 1
              writeOnly: true
              description: |
                Google OAuth client secret. Write-only: encrypted at
                rest, never returned by any response.

    CreateMailboxRequest:
      description: |
        Mailbox creation payload, discriminated on `auth_kind`; each
        kind carries its own write-only credential fields.
      oneOf:
        - $ref: "#/components/schemas/CreateMailboxBasicRequest"
        - $ref: "#/components/schemas/CreateMailboxOauthM365Request"
        - $ref: "#/components/schemas/CreateMailboxOauthGoogleRequest"
      discriminator:
        propertyName: auth_kind
        mapping:
          basic: "#/components/schemas/CreateMailboxBasicRequest"
          oauth_m365: "#/components/schemas/CreateMailboxOauthM365Request"
          oauth_google: "#/components/schemas/CreateMailboxOauthGoogleRequest"

    UpdateMailboxRequest:
      type: object
      description: |
        Partial update; omitted fields are left unchanged. The write-only
        credential fields rotate stored secrets and are never echoed:
        `password` applies to `basic`; `tenant_id`, `client_id`,
        `client_secret` apply to the OAuth kinds. When `auth_kind`
        changes, the credential fields required by the new kind must be
        supplied in the same request (400 otherwise).
      properties:
        name:
          type: string
          minLength: 1
        email_address:
          type: string
          format: email
        active:
          type: boolean
        auth_kind:
          $ref: "#/components/schemas/MailboxAuthKind"
        imap_host:
          type: string
          minLength: 1
        imap_port:
          type: integer
          minimum: 1
          maximum: 65535
        imap_tls_mode:
          $ref: "#/components/schemas/MailTLSMode"
        imap_username:
          type: string
          minLength: 1
        smtp_host:
          type: string
          minLength: 1
        smtp_port:
          type: integer
          minimum: 1
          maximum: 65535
        smtp_tls_mode:
          $ref: "#/components/schemas/MailTLSMode"
        smtp_username:
          type: string
          minLength: 1
        from_display_name:
          type: string
        signature:
          type: string
        auto_ack_enabled:
          type: boolean
        password:
          type: string
          minLength: 1
          writeOnly: true
          description: New password (basic auth). Never echoed.
        tenant_id:
          type: string
          minLength: 1
          writeOnly: true
          description: New Entra tenant id (oauth_m365).
        client_id:
          type: string
          minLength: 1
          writeOnly: true
          description: New OAuth client id (oauth_m365 / oauth_google).
        client_secret:
          type: string
          minLength: 1
          writeOnly: true
          description: |
            New OAuth client secret (oauth_m365 / oauth_google). Never
            echoed. Rotating an oauth_google client invalidates the
            stored refresh token — re-run the Google connect flow.

    MailboxTestResult:
      type: object
      description: |
        Outcome of a live mailbox connectivity test. `ok=false` still
        arrives as HTTP 200 — the test ran; this object is its result.
      required: [ok, detail, latency_ms]
      properties:
        ok:
          type: boolean
        detail:
          type: string
          description: |
            Human-readable outcome — the failing step and error on
            failure (e.g. "IMAP AUTHENTICATE: invalid credentials"), a
            short success summary otherwise.
        latency_ms:
          type: integer
          format: int64
          minimum: 0
          description: Wall-clock duration of the whole test.

    MailboxTestSendRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          format: email
          description: Recipient of the test message.

    GoogleOauthStart:
      type: object
      description: Where to send the admin's browser to grant consent.
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          format: uri
          description: |
            Google authorization URL (authorization-code flow with
            `access_type=offline`, signed single-use `state`).

    ExternalUrlSetting:
      type: object
      description: The instance's public base URL setting.
      required: [external_url]
      properties:
        external_url:
          type: string
          description: |
            Absolute http(s) base URL the instance is reached at, no
            trailing slash (e.g. "https://desk.example.com"); '' until
            configured.

    SetExternalUrlRequest:
      type: object
      required: [external_url]
      properties:
        external_url:
          type: string
          format: uri
          minLength: 1
          pattern: "^https?://"
          description: |
            Absolute http(s) base URL with no path, query, or fragment;
            a trailing slash is stripped before storage.

    SetupStatus:
      type: object
      description: First-run installer state (M4).
      required: [completed, needs_token]
      properties:
        completed:
          type: boolean
          description: |
            True once the installer has finished (or a headless admin was
            created).
        needs_token:
          type: boolean
          description: |
            True while no admin exists yet — the state in which
            `POST /setup/admin` must carry the signed installer token.
            False once an admin exists (remaining steps use that session).

    SetupAdminRequest:
      type: object
      required: [token, name, email, password]
      properties:
        token:
          type: string
          minLength: 1
          description: |
            The signed installer token printed to the server logs on first
            boot.
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          description: Initial admin password (minimum 10 characters).

    SetupInstanceRequest:
      type: object
      required: [name, external_url]
      properties:
        name:
          type: string
          minLength: 1
          description: Instance display name (branding).
        external_url:
          type: string
          format: uri
          minLength: 1
          pattern: "^https?://"
          description: |
            Absolute http(s) base URL with no path, query, or fragment; a
            trailing slash is stripped before storage.

    InstanceSettings:
      type: object
      description: The instance display name and public URL settings.
      required: [name, external_url]
      properties:
        name:
          type: string
          description: Instance display name ('' until configured).
        external_url:
          type: string
          description: Public base URL, no trailing slash ('' until configured).

    SetupCompleteResult:
      type: object
      description: Outcome of finishing first-run setup.
      required: [completed, welcome_ticket_number]
      properties:
        completed:
          type: boolean
          description: Always true on success.
        welcome_ticket_number:
          type: ["string", "null"]
          pattern: "^[0-9]{8}-[0-9]{4,}$"
          description: |
            Number of the seeded welcome ticket (YYYYMMDD-NNNN); null if
            one already existed and none was seeded.

    PortalTicket:
      type: object
      description: |
        A customer's own ticket, portal projection. Deliberately omits
        assignee and team — the portal never exposes staff routing.
      required:
        - id
        - number
        - subject
        - status
        - priority
        - created_at
        - updated_at
        - closed_at
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          pattern: "^[0-9]{8}-[0-9]{4,}$"
        subject:
          type: string
        status:
          $ref: "#/components/schemas/TicketStatus"
        priority:
          $ref: "#/components/schemas/TicketPriority"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: ["string", "null"]
          format: date-time

    PortalArticle:
      type: object
      description: |
        One **public** message in a portal ticket's thread. Internal notes
        are never represented here. The author is reduced to `sender_type`
        (customer / agent / system) so staff identities are not exposed.
      required:
        - id
        - ticket_id
        - sender_type
        - body_text
        - body_html
        - created_at
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        sender_type:
          $ref: "#/components/schemas/ArticleSenderType"
        body_text:
          type: string
        body_html:
          type: ["string", "null"]
          description: Sanitized HTML body; null when the article is plain text.
        created_at:
          type: string
          format: date-time

    PortalTicketDetail:
      description: A portal ticket with its public thread.
      allOf:
        - $ref: "#/components/schemas/PortalTicket"
        - type: object
          required: [articles]
          properties:
            articles:
              type: array
              description: Public articles only, oldest first.
              items:
                $ref: "#/components/schemas/PortalArticle"

    PortalCreateTicketRequest:
      type: object
      required: [subject, body]
      properties:
        subject:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
          description: Plain-text body of the ticket's first public article.

    PortalReplyRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          description: Plain-text public reply body.

    PublicTicketRequest:
      type: object
      required: [subject, body, email]
      properties:
        subject:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          description: |
            Submitter's email; the requester is created from or matched to
            it.
        name:
          type: string
          description: Submitter's display name (optional).
        _honeypot:
          type: string
          description: |
            Anti-spam honeypot. Hidden from real users and expected to be
            empty; a non-empty value causes the submission to be silently
            dropped (still 202, no ticket created).

    PublicTicketAccepted:
      type: object
      description: |
        Acknowledgement of a public submission. `ticket_number` is present
        when a ticket was created and absent when an anti-spam control
        silently dropped the submission.
      properties:
        ticket_number:
          type: string
          pattern: "^[0-9]{8}-[0-9]{4,}$"
          description: The assigned ticket number (YYYYMMDD-NNNN).

    ApiKeyScope:
      type: string
      description: |
        API-key permission. `read` allows safe (GET) operations; `write`
        additionally allows mutating operations.
      enum: [read, write]

    ApiKey:
      type: object
      description: |
        Scoped machine API key metadata. The secret is never included —
        only the display prefix and usage columns.
      required:
        - id
        - name
        - key_prefix
        - scopes
        - created_by
        - last_used_at
        - created_at
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          description: Non-secret display fragment (e.g. "sd_live_ab12cd").
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_by:
          type: string
          format: uuid
          description: |
            The admin/agent who minted the key; requests act as this user.
        last_used_at:
          type: ["string", "null"]
          format: date-time
          description: |
            Last successful authentication with this key; null if never
            used.
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: ["string", "null"]
          format: date-time
          description: When the key was revoked; null while live.

    CreateApiKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"

    ApiKeyCreated:
      description: |
        A newly minted key including its **one-time** plaintext. The `key`
        is shown only in this response and can never be retrieved again.
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: |
                Full plaintext key (`sd_live_…`). Returned once; store it
                now. Only its SHA-256 digest is persisted.

    WebhookEvent:
      type: string
      description: A subscribable outbound event type.
      enum: [ticket.created, ticket.updated, article.created]

    WebhookDeliveryStatus:
      type: string
      description: |
        Delivery state: `pending` (enqueued or retrying), `success` (2xx
        received), `failed` (retries exhausted).
      enum: [pending, success, failed]

    Webhook:
      type: object
      description: |
        An outbound webhook endpoint. The signing secret is never included
        in any response.
      required: [id, name, url, events, active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEvent"
        active:
          type: boolean
          description: Inactive endpoints receive no deliveries.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required: [name, url, events]
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
          pattern: "^https?://"
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEvent"
        active:
          type: boolean
          default: true
        secret:
          type: string
          minLength: 1
          writeOnly: true
          description: |
            HMAC-SHA256 signing secret. Write-only: encrypted at rest and
            never echoed. Omit to have a random secret generated; the
            effective secret is returned once as `signing_secret`.

    WebhookCreated:
      description: |
        A newly created webhook including its **one-time** signing secret.
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [signing_secret]
          properties:
            signing_secret:
              type: string
              description: |
                The effective HMAC-SHA256 signing secret (supplied or
                generated). Returned once; configure it on the receiver to
                verify the `X-SlateDesk-Signature` header. Never returned
                again.

    UpdateWebhookRequest:
      type: object
      description: Partial update; omitted fields are left unchanged.
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
          pattern: "^https?://"
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEvent"
        active:
          type: boolean
        secret:
          type: string
          minLength: 1
          writeOnly: true
          description: |
            Rotate the HMAC-SHA256 signing secret. Write-only and never
            echoed — the caller supplies the new value (no generation on
            update).

    WebhookTestResult:
      type: object
      description: |
        Outcome of a synchronous webhook test ping. `ok=false` still
        arrives as HTTP 200 — the ping was attempted; this object is its
        result.
      required: [ok, response_code, detail, latency_ms]
      properties:
        ok:
          type: boolean
          description: True when the endpoint answered 2xx.
        response_code:
          type: ["integer", "null"]
          description: |
            HTTP status returned by the endpoint; null on transport error.
        detail:
          type: string
          description: |
            Human-readable outcome (the error on failure, a short summary
            otherwise).
        latency_ms:
          type: integer
          format: int64
          minimum: 0
          description: Wall-clock duration of the ping.

    WebhookDelivery:
      type: object
      description: One row of the durable webhook delivery log.
      required:
        - id
        - webhook_id
        - event_type
        - ticket_id
        - payload
        - status
        - response_code
        - attempts
        - last_error
        - created_at
        - delivered_at
      properties:
        id:
          type: integer
          format: int64
        webhook_id:
          type: string
          format: uuid
        event_type:
          type: string
          description: The event type this delivery carries.
        ticket_id:
          type: ["string", "null"]
          format: uuid
          description: The ticket the event concerns; null when not ticket-scoped.
        payload:
          type: object
          additionalProperties: true
          description: The signed JSON payload delivered to the endpoint.
        status:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
        response_code:
          type: ["integer", "null"]
          description: Last HTTP status from the endpoint; null before any response.
        attempts:
          type: integer
          minimum: 0
          description: Number of delivery attempts so far.
        last_error:
          type: ["string", "null"]
          description: Most recent delivery error; null on success.
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: ["string", "null"]
          format: date-time
          description: When a 2xx was received; null until delivered.

    CannedReply:
      type: object
      description: |
        A reusable agent reply snippet. `body` stores the raw template;
        `{{ticket.number}}` / `{{requester.name}}` are substituted at
        composer-insert time.
      required: [id, title, body, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCannedReplyRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1

    UpdateCannedReplyRequest:
      type: object
      description: Partial update; omitted fields are left unchanged.
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
