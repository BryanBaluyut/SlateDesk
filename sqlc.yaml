# sqlc configuration (v2). Generate with:  make sqlc
# Tooling note: sqlc is pinned to v1.31.1 (see Makefile SQLC_VERSION).
version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/queries"
    schema: "internal/migrate/sql"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "citext"
            go_type: "string"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.date"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
          # tsvector columns are generated server-side and only ever read
          # (pgx returns unknown-OID values as text, which scans into string).
          - db_type: "tsvector"
            go_type: "string"
